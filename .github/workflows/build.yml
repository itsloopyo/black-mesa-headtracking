name: Build

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

# Read-only token. This job runs on every branch push and on pull requests, so
# it is the widest-reach workflow in the repo; it only needs to read the repo
# (checkout + submodule). Without the block the job inherits whatever the
# repository default is, which is write on repos created before the default
# changed.
permissions:
  contents: read

jobs:
  build:
    name: Build and Validate
    runs-on: windows-latest
    # A hung cmake or MSBuild otherwise sits on a runner until GitHub's 6-hour
    # ceiling. Comfortably above a cold configure + x86 release build.
    timeout-minutes: 30
    # release.yml already builds the version-bump commit release.ps1 lands.
    if: ${{ !startsWith(github.event.head_commit.message, 'Release v') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: recursive
          # Nothing in this job pushes, and the steps after checkout run repo
          # scripts (pixi run package, and everything the pixi task chain
          # invokes). Leaving the token in .git/config would hand all of them a
          # credential they have no use for.
          persist-credentials: false

      - name: Setup Visual Studio environment
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      # run-install stays off: the C++ toolchain and CMake come from the runner
      # image, and the first `pixi run` below installs the one pixi dependency,
      # Node, which core's config and manifest checks run on.
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          run-install: false

      # Build + package through the SAME command a developer runs locally. All
      # build logic lives in the pixi task chain (setup -> build -> package);
      # the workflow owns none, so local and CI cannot drift.
      - name: Build and package
        shell: pwsh
        run: |
          pixi run package
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::pixi run package failed"; exit 1 }

      - name: Verify installer was produced
        shell: pwsh
        run: |
          $zip = Get-ChildItem release/*-installer.zip -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $zip) {
            Write-Host "::error::No installer ZIP was produced by 'pixi run package'"
            exit 1
          }
